<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% if object %}Изменить задачу{% else %}Новая задача{% endif %}</title>
</head>
<body>
    <h1>{% if object %}Изменить задачу{% else %}Новая задача{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <a href="{% url 'crud:task_list' %}">Отмена</a>
</body>
</html>
